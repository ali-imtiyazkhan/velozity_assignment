services:
  - type: web
    name: velozity-backend
    runtime: docker
    dockerfilePath: ./apps/backend/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: FRONTEND_URL
        value: https://velozity-assignment.vercel.app
      - key: DATABASE_URL
        fromDatabase:
          name: velozity-db
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
    healthCheckPath: /health
    autoDeploy: true

databases:
  - name: velozity-db
    plan: free
    region: oregon
    databaseName: velozity
    user: velozity